[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonias"
version = "2.0.0"
description = "Modelos de prediccion epidemiologica de hospitalizaciones y defunciones (UNSA & Oklahoma)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UNSA & University of Oklahoma" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "tensorflow>=2.15.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

